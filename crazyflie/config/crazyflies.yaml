# Definition of the various robot types
robot_types:
  cf21_single:
    motion_capture:
      tracking: "librigidbodytracker"  # one of "vendor", "librigidbodytracker"
      enabled: true
      marker: default_single_marker
      dynamics: leniant
    big_quad: False
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V

  cf21_single_PID:
    motion_capture:
      tracking: "librigidbodytracker"  # one of "vendor", "librigidbodytracker"
      enabled: true
      marker: default_single_marker
      dynamics: leniant
    big_quad: False
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V
    firmware_params:
      stabilizer:
        controller: 1

  cf21_color_only:
    motion_capture:
      tracking: "librigidbodytracker"  # one of "vendor", "librigidbodytracker"
      enabled: false
      marker: default_single_marker
      dynamics: leniant
    big_quad: False

  cf21:
    motion_capture:
      tracking: "librigidbodytracker" # one of "vendor", "librigidbodytracker"
      enabled: false  # Use false if object is defined in optitrack!
      # only if enabled; see motion_capture.yaml
      # marker: default_single_marker
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V
    # firmware_params:
    #   kalman:
    #     pNAcc_xy: 1.0 # default 0.5
    #firmware_logging:
